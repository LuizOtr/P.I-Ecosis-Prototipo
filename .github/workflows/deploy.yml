name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Trava de seguranca: Clarity e GTM sao a unica telemetria do prototipo.
      # Se um refactor remover um snippet do <head>, ou deixar o ID do codigo
      # diferente do ID do HTML, o deploy para aqui em vez de publicar uma
      # versao que nao coleta nada ou que coleta no lugar errado.
      - name: Verify analytics tags in build output
        run: |
          set -euo pipefail
          id_src=$(grep -oP '(?<=CLARITY_PROJECT_ID = ")[a-z0-9]+' src/lib/clarity.ts)
          id_dist=$(grep -oP '(?<=clarity", "script", ")[a-z0-9]+' dist/index.html || true)
          echo "Clarity em src/lib/clarity.ts: ${id_src:-<vazio>}"
          echo "Clarity em dist/index.html:    ${id_dist:-<vazio>}"
          if [ -z "$id_dist" ]; then
            echo "::error::Codigo do Clarity ausente em dist/index.html."
            exit 1
          fi
          if [ "$id_src" != "$id_dist" ]; then
            echo "::error::ID do Clarity divergente: clarity.ts=$id_src, index.html=$id_dist."
            exit 1
          fi
          gtm_src=$(grep -oP '(?<=GTM_CONTAINER_ID = ")GTM-[A-Z0-9]+' src/lib/analytics.ts || true)
          gtm_dist=$(grep -oP 'gtm\.js\?id=GTM-[A-Z0-9]+' dist/index.html | head -1 | sed 's/.*id=//' || true)
          echo "GTM em src/lib/analytics.ts: ${gtm_src:-<vazio>}"
          echo "GTM em dist/index.html:      ${gtm_dist:-<vazio>}"
          if [ -z "$gtm_dist" ]; then
            echo "::error::Snippet do Google Tag Manager ausente em dist/index.html."
            exit 1
          fi
          if [ "$gtm_src" != "$gtm_dist" ]; then
            echo "::error::Container do GTM divergente: analytics.ts=$gtm_src, index.html=$gtm_dist."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4